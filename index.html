<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Dental Spa - Assessment & Video Intro</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            background-color: #ffffff; 
            overflow: hidden;
            transition: background 1s ease, background-color 1s ease;
        }

        .bg-slider {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            opacity: 1; 
            filter: blur(0px);
            transform: scale(1);
            transition: filter 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 1s ease;
        }

        .bg-blur-effect {
            filter: blur(4px);
            transform: scale(1.03);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.2); 
            z-index: 1;
            transition: background 1s ease;
        }

        .welcome-overlay {
            background: transparent !important;
        }

        #smokeCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 99; 
            pointer-events: none; 
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        .quiz-container {
            position: relative;
            z-index: 3;
            background: transparent; 
            border: none;
            padding: 20px;
            width: 90%;
            max-width: 460px;
            box-shadow: none;
            text-align: center;
            transform: scale(1);
            opacity: 1;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease-in-out;
        }

        .start-btn, .option-btn {
            position: relative;
            z-index: 100;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
        }

        .welcome-video {
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.15), 0 0 15px rgba(0,0,0,0.05);
            outline: none;
            background-color: #000;
            object-fit: cover;
        }

        .start-btn {
            background: rgba(255, 20, 147, 0.15);
            border: 1px solid rgba(255, 20, 147, 0.5);
            padding: 16px 60px;
            border-radius: 30px;
            color: #ff1493; 
            font-size: 1.3rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.1);
        }

        .start-btn:hover, .start-btn:active {
            background: rgba(255, 20, 147, 0.8);
            border-color: #ff1493;
            color: #ffffff;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 20, 147, 0.3);
        }

        .quiz-pull-out {
            transform: scale(0.92);
            opacity: 0;
        }

        .quiz-pull-in-prepare {
            transform: scale(1.08);
            opacity: 0;
            transition: none;
        }

        h2 {
            margin-bottom: 40px;
            font-size: 1.5rem;
            line-height: 1.6;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 1px 3px rgba(0, 0, 0, 0.9);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .option-btn {
            background: rgba(255, 20, 147, 0.18); 
            border: 1px solid rgba(255, 20, 147, 0.4); 
            padding: 20px 24px;
            border-radius: 20px;
            color: #ffffff; 
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            text-align: right;
            width: 100%;
            outline: none;
        }

        .option-btn:hover, .option-btn:active {
            background: rgba(255, 20, 147, 0.45); 
            border-color: rgba(255, 20, 147, 0.8);
            color: #ffffff;
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(255, 20, 147, 0.25);
        }

        @keyframes glassSelected {
            0% { background: rgba(255, 20, 147, 0.45); color: #ffffff;}
            100% { background: #ff1493; border-color: #ff1493; color: #ffffff; text-shadow: none; transform: scale(1.04); box-shadow: 0 10px 25px rgba(255, 20, 147, 0.35);}
        }

        .btn-selected {
            animation: glassSelected 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            pointer-events: none;
        }

        .disabled {
            pointer-events: none;
            opacity: 0.15;
            transform: scale(0.96);
        }

        .hidden {
            display: none !important;
        }

        /* ستايلات شاشات النتائج */
        .mode-glow-bg {
            background: radial-gradient(circle, #ffc0cb 0%, #ff69b4 100%) !important;
            box-shadow: inset 0 0 80px rgba(255, 255, 255, 0.6);
        }

        .mode-balance-bg {
            background: linear-gradient(135deg, #2c1a24 0%, #ff69b4 100%) !important;
        }

        .mode-revival-bg {
            background: radial-gradient(circle, #1a0813 0%, #4a1535 100%) !important;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
        }

        .mode-glow-bg #bg-layer, .mode-balance-bg #bg-layer, .mode-revival-bg #bg-layer {
            display: none !important;
        }

        .result-intro {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ff1493;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .result-badge {
            font-size: 3.4rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.25);
            margin-bottom: 5px;
        }

        .result-score {
            font-size: 1.4rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 25px;
        }

        .result-description {
            font-size: 1.05rem;
            font-weight: 500;
            color: #ffffff;
            line-height: 1.6;
            padding: 0 15px;
            margin-bottom: 35px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.15);
            direction: ltr; 
            text-align: center;
        }

        .result-cta-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.5;
            direction: ltr;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            padding: 0 10px;
            animation: softPulse 2.5s infinite ease-in-out;
        }

        @keyframes softPulse {
            0% { opacity: 0.85; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.01); }
            100% { opacity: 0.85; transform: scale(1); }
        }

        #result-screen {
            animation: fadeInResult 0.8s cubic-bezier(0.215, 0.610, 0.355, 1) forwards;
        }

        @keyframes fadeInResult {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-slider" id="bg-layer"></div>
    <div class="overlay welcome-overlay" id="overlay-layer"></div>

    <canvas id="smokeCanvas"></canvas>

    <div class="quiz-container" id="quiz-box">
        
        <div id="welcome-screen" class="welcome-screen">
            <video class="welcome-video" id="introVideo" playsinline>
                <source src="intro.mp4" type="video/mp4">
                متصفحك لا يدعم تشغيل الفيديو.
            </video>
            <button class="start-btn" id="start-quiz-btn">START</button>
        </div>

        <div id="question-screen" class="hidden">
            <h2 id="question-text">جاري تحضير تجربة الـ Spa...</h2>
            <div class="options-list" id="options-container"></div>
        </div>

        <div id="result-screen" class="hidden">
            <div class="result-intro">Your Whisper result is:</div>
            <div id="badge-container" class="result-badge"></div>
            <div id="score-container" class="result-score"></div>
            <div id="description-container" class="result-description"></div>
            <div class="result-cta-text">
                Send us your Whisper result (a screenshot)<br>and unlock your Pink Spa experience 💗
            </div>
        </div>
    </div>

    <script>
        const clickSound = new Audio('click.mp3');
        clickSound.volume = 0.5;

        const welcomeSound = new Audio('welcome.mp3');
        welcomeSound.volume = 0.7; 

        let isAudioUnlocked = false;

        function unlockMobileAudio() {
            if (isAudioUnlocked) return;
            [clickSound, welcomeSound].forEach(sound => {
                const playPromise = sound.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        sound.pause();
                        sound.currentTime = 0;
                    }).catch(err => {});
                }
            });
            isAudioUnlocked = true;
        }

        const quizData = [
            {
                question: "كم مرة تشرب قهوة او شاي يوميا؟",
                options: ["ولا مرة", "مرة او مرتان", "من ثلاث الى خمس مرات", "عايش عليها"],
                scores: [100, 70, 35, 0],
                image: "bg1.png"
            },
            {
                question: "هل تدخن？",
                options: ["لا", "احيانا", "يوميا", "عدة باكيتات باليوم"],
                scores: [100, 70, 35, 0],
                image: "bg2.png"
            },
            {
                question: "هل تشرب ماء كافي يوميا؟",
                options: ["نعم", "أحياناً", "لا"],
                scores: [100, 50, 0],
                image: "bg3.png"
            },
            {
                question: "احد عرض عليك علكة او نعناع بشكل مفاجئ؟",
                options: ["لا", "احيانا", "مرات متكررة"],
                scores: [100, 50, 0],
                image: "bg4.png"
            },
            {
                question: "تحس بجفاف بالفم؟",
                options: ["نادرا", "احيانا", "دائما"],
                scores: [100, 50, 0],
                image: "bg5.png"
            },
            {
                question: "تحس الناس تبتعد و انت تحجي؟",
                options: ["لا", "يمكن", "صارت اكثر من مرة"],
                scores: [100, 50, 0],
                image: "bg6.png"
            }
        ];

        // ميزة التحميل المسبق للصور (Preloading) لضمان ظهورها الفوري وبدون تأخير
        function preloadImages() {
            quizData.forEach(data => {
                const img = new Image();
                img.src = data.image;
            });
        }
        // استدعاء دالة التحميل المسبق فور تشغيل الصفحة
        preloadImages();

        let currentQuestionIndex = 0;
        let totalScore = 0;
        let activeAnimationId = null; 

        const quizBox = document.getElementById('quiz-box');
        const bgLayer = document.getElementById('bg-layer');
        const overlayLayer = document.getElementById('overlay-layer');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        
        const welcomeScreen = document.getElementById('welcome-screen');
        const questionScreen = document.getElementById('question-screen');
        const resultScreen = document.getElementById('result-screen');
        const badgeContainer = document.getElementById('badge-container');
        const scoreContainer = document.getElementById('score-container');
        const descriptionContainer = document.getElementById('description-container');
        const smokeCanvas = document.getElementById('smokeCanvas');
        const startQuizBtn = document.getElementById('start-quiz-btn');
        const introVideo = document.getElementById('introVideo');

        // تحديد حجم الـ Canvas المبدئي فوراً عند فتح التطبيق لضمان جاهزيته للمؤثرات
        function initCanvasDimensions() {
            smokeCanvas.width = window.innerWidth;
            smokeCanvas.height = window.innerHeight;
        }
        initCanvasDimensions();
        window.addEventListener('resize', initCanvasDimensions);

        startQuizBtn.addEventListener('click', () => {
            unlockMobileAudio();
            
            introVideo.muted = false;
            introVideo.currentTime = 0;
            introVideo.play().catch(e => {});

            // تشغيل تأثير الدخان كـ Overlay فوق الفيديو فوراً وبدون مشاكل أبعاد
            initResultEffects('video-overlay');

            setTimeout(() => {
                quizBox.classList.add('quiz-pull-out');
            }, 2500); 
        });

        introVideo.addEventListener('ended', () => {
            welcomeScreen.classList.add('hidden');
            questionScreen.classList.remove('hidden');
            overlayLayer.classList.remove('welcome-overlay');
            quizBox.classList.remove('quiz-pull-out');
            quizBox.classList.add('quiz-pull-in-prepare');
            
            welcomeSound.currentTime = 0;
            welcomeSound.play().catch(err => {});

            // إخفاء دخان الفيديو مؤقتاً لتظهر خلفية السؤال المجهزة مسبقاً بشكل نقي
            smokeCanvas.style.opacity = "0";

            setTimeout(() => {
                quizBox.style.transition = '';
                loadQuestion();
            }, 50);
        });

        function loadQuestion() {
            const currentData = quizData[currentQuestionIndex];
            
            quizBox.classList.remove('quiz-pull-out', 'quiz-pull-in-prepare');
            bgLayer.classList.remove('bg-blur-effect');
            
            bgLayer.style.backgroundImage = `url('${currentData.image}')`;
            questionText.innerText = currentData.question;
            optionsContainer.innerHTML = '';

            currentData.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.classList.add('option-btn');
                button.innerText = option;
                button.addEventListener('click', (e) => handleAnswer(e, index));
                optionsContainer.appendChild(button);
            });
        }

        function handleAnswer(e, selectedIndex) {
            const selectedButton = e.target;
            const allButtons = optionsContainer.querySelectorAll('.option-btn');
            const currentData = quizData[currentQuestionIndex];

            totalScore += currentData.scores[selectedIndex];
            
            clickSound.currentTime = 0;
            clickSound.play().catch(e => {});

            selectedButton.classList.add('btn-selected');

            allButtons.forEach(btn => {
                if (btn !== selectedButton) btn.classList.add('disabled');
            });

            setTimeout(() => {
                quizBox.classList.add('quiz-pull-out');
                bgLayer.classList.add('bg-blur-effect');

                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < quizData.length) {
                        quizBox.style.transition = 'none';
                        quizBox.classList.remove('quiz-pull-out');
                        quizBox.classList.add('quiz-pull-in-prepare');
                        
                        setTimeout(() => {
                            quizBox.style.transition = '';
                            loadQuestion();
                        }, 50);
                    } else {
                        showResults();
                    }
                }, 600);
            }, 600);
        }

        function triggerFastConfetti() {
            var duration = 2 * 1000; 
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 12, angle: 60, spread: 65, origin: { x: 0, y: 0.85 } });
                confetti({ particleCount: 12, angle: 120, spread: 65, origin: { x: 1, y: 0.85 } });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }

        function initResultEffects(mode) {
            if (activeAnimationId) {
                cancelAnimationFrame(activeAnimationId);
            }

            smokeCanvas.style.opacity = "1";
            const ctx = smokeCanvas.getContext('2d');
            
            // التأكد من ملء الشاشة بالكامل بناءً على الحجم الحالي فور تشغيل الفانكشن
            smokeCanvas.width = window.innerWidth;
            smokeCanvas.height = window.innerHeight;

            const particles = [];
            let particleCount = 30;

            if (mode === 'glow') particleCount = 60; 
            if (mode === 'revival') particleCount = 45; 
            // رفع كثافة دخان الفيديو قليلاً لجعل المؤثر أوضح كـ overlay وردي
            if (mode === 'video-overlay') particleCount = 35; 

            class CustomEffectParticle {
                constructor() { this.reset(true); }
                reset(init = false) {
                    if (mode === 'glow') {
                        this.x = Math.random() * smokeCanvas.width;
                        this.y = init ? Math.random() * smokeCanvas.height : smokeCanvas.height + 20;
                        this.size = Math.random() * 3 + 1;
                        this.speedX = Math.random() * 1.5 - 0.75;
                        this.speedY = -(Math.random() * 2.5 + 1.5); 
                        this.opacity = Math.random() * 0.8 + 0.2;
                    } 
                    else if (mode === 'balance' || mode === 'video-overlay') {
                        this.x = init ? Math.random() * smokeCanvas.width : -40;
                        this.y = Math.random() * smokeCanvas.height;
                        this.size = Math.random() * 120 + 80;
                        this.speedX = Math.random() * 0.6 + 0.2;
                        this.speedY = Math.random() * 0.3 - 0.15;
                        this.opacity = mode === 'video-overlay' ? Math.random() * 0.14 + 0.05 : Math.random() * 0.2 + 0.05;
                        this.vs = Math.random() * 0.08 + 0.02;
                    } 
                    else if (mode === 'revival') {
                        this.x = init ? Math.random() * smokeCanvas.width : -100;
                        this.y = Math.random() * (smokeCanvas.height * 0.4) + (smokeCanvas.height * 0.4); 
                        this.size = Math.random() * 200 + 150; 
                        this.speedX = Math.random() * 0.3 + 0.1;
                        this.speedY = Math.random() * 0.1 - 0.05;
                        this.opacity = Math.random() * 0.35 + 0.15; 
                        this.vs = Math.random() * 0.05 + 0.01;
                    }
                }

                update() {
                    if (mode === 'glow') {
                        this.y += this.speedY;
                        this.x += this.speedX;
                        if (this.y < -10) this.reset();
                    } else {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        if (mode === 'balance' || mode === 'video-overlay') this.size += this.vs;
                        if (this.x > smokeCanvas.width + 100) this.reset();
                    }
                }

                draw() {
                    ctx.beginPath();
                    if (mode === 'glow') {
                        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = "#ffffff";
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    } 
                    else if (mode === 'balance' || mode === 'video-overlay') {
                        let gradient = ctx.createRadialGradient(this.x, this.y, 5, this.x, this.y, this.size);
                        gradient.addColorStop(0, `rgba(255, 182, 193, ${this.opacity})`);
                        gradient.addColorStop(0.6, `rgba(255, 20, 147, ${this.opacity * 0.3})`);
                        gradient.addColorStop(1, 'rgba(255,255,255,0)');
                        ctx.fillStyle = gradient;
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fill();
                    } 
                    else if (mode === 'revival') {
                        let gradient = ctx.createRadialGradient(this.x, this.y, 10, this.x, this.y, this.size);
                        gradient.addColorStop(0, `rgba(255, 20, 147, ${this.opacity})`);
                        gradient.addColorStop(0.5, `rgba(139, 0, 139, ${this.opacity * 0.4})`);
                        gradient.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = gradient;
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            for (let i = 0; i < particleCount; i++) particles.push(new CustomEffectParticle());

            function animate() {
                ctx.clearRect(0, 0, smokeCanvas.width, smokeCanvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                activeAnimationId = requestAnimationFrame(animate);
            }
            animate();
        }

        function showResults() {
            questionScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            quizBox.style.transition = '';
            quizBox.classList.remove('quiz-pull-out', 'quiz-pull-in-prepare');
            overlayLayer.classList.add('welcome-overlay'); 
            
            let finalCalculatedScore = (totalScore / 6).toFixed(1);
            
            let resultWord = "";
            let resultDescription = "";
            
            if (finalCalculatedScore >= 91.1 && finalCalculatedScore <= 100.0) {
                document.body.classList.add('mode-glow-bg');
                resultWord = "Pink Glow";
                resultDescription = "Freshness, confidence, and care are clearly part of your daily whisper energy, a little care keeps it unforgettable.";
                initResultEffects('glow');
                triggerFastConfetti();
                
            } else if (finalCalculatedScore >= 70.0 && finalCalculatedScore <= 91.0) {
                document.body.classList.add('mode-balance-bg');
                resultWord = "Pink Balance";
                resultDescription = "small daily details may be affecting your whisper freshness and confidence more than you notice, it only needs the right touch.";
                initResultEffects('balance');
                
            } else if (finalCalculatedScore < 70.0) {
                document.body.classList.add('mode-revival-bg');
                resultWord = "Pink Revival";
                resultDescription = "Your whisper is ready for a fresh beginning, one step could unlock your full Pink Glow.";
                initResultEffects('revival');
            }
            
            badgeContainer.innerText = resultWord;
            scoreContainer.innerText = `${finalCalculatedScore}%`;
            descriptionContainer.innerText = resultDescription;
        }
    </script>
</body>
</html>
