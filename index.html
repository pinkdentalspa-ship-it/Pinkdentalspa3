<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Dental Spa - Assessment & Video Intro</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            background-color: #ffffff; /* خلفية بيضاء افتراضية لواجهة الفيديو */
            overflow: hidden;
            transition: background 1s ease, background-color 1s ease;
        }

        .bg-slider {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            opacity: 1; 
            filter: blur(0px);
            transform: scale(1);
            transition: filter 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 1s ease;
        }

        .bg-blur-effect {
            filter: blur(4px);
            transform: scale(1.03);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.2); 
            z-index: 1;
            transition: background 1s ease;
        }

        /* تعديل الأوفرلاي ليكون شفافاً في الشاشة الرئيسية للحفاظ على بياض الخلفية */
        .welcome-overlay {
            background: transparent !important;
        }

        #smokeCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; 
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .quiz-container {
            position: relative;
            z-index: 3;
            background: transparent; 
            border: none;
            padding: 20px;
            width: 90%;
            max-width: 440px;
            box-shadow: none;
            text-align: center;
            transform: scale(1);
            opacity: 1;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease-in-out;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
        }

        .welcome-video {
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.15), 0 0 15px rgba(0,0,0,0.05);
            outline: none;
            background-color: #000;
            object-fit: cover;
        }

        .start-btn {
            background: rgba(255, 20, 147, 0.15);
            border: 1px solid rgba(255, 20, 147, 0.5);
            padding: 16px 60px;
            border-radius: 30px;
            color: #ff1493; 
            font-size: 1.3rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.1);
        }

        .start-btn:hover, .start-btn:active {
            background: rgba(255, 20, 147, 0.8);
            border-color: #ff1493;
            color: #ffffff;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 20, 147, 0.3);
        }

        .quiz-pull-out {
            transform: scale(0.92);
            opacity: 0;
        }

        .quiz-pull-in-prepare {
            transform: scale(1.08);
            opacity: 0;
            transition: none;
        }

        h2 {
            margin-bottom: 40px;
            font-size: 1.5rem;
            line-height: 1.6;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 1px 3px rgba(0, 0, 0, 0.9);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .option-btn {
            background: rgba(255, 20, 147, 0.18); 
            border: 1px solid rgba(255, 20, 147, 0.4); 
            padding: 20px 24px;
            border-radius: 20px;
            color: #ffffff; 
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            text-align: right;
            width: 100%;
            outline: none;
        }

        .option-btn:hover, .option-btn:active {
            background: rgba(255, 20, 147, 0.45); 
            border-color: rgba(255, 20, 147, 0.8);
            color: #ffffff;
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(255, 20, 147, 0.25);
        }

        @keyframes glassSelected {
            0% { 
                background: rgba(255, 20, 147, 0.45);
                color: #ffffff;
            }
            100% { 
                background: #ff1493; 
                border-color: #ff1493;
                color: #ffffff;
                text-shadow: none;
                transform: scale(1.04);
                box-shadow: 0 10px 25px rgba(255, 20, 147, 0.35);
            }
        }

        .btn-selected {
            animation: glassSelected 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            pointer-events: none;
        }

        .disabled {
            pointer-events: none;
            opacity: 0.15;
            transform: scale(0.96);
        }

        .hidden {
            display: none !important;
        }

        /* وضعيات النتائج لتغيير الخلفيات بشكل كلي وثابت */
        .mode-white-bg {
            background-color: #ffffff !important;
            background: #ffffff !important;
        }
        .mode-white-bg #bg-layer { display: none !important; }
        .mode-white-bg .overlay { background: transparent !important; }

        /* وضعية التوهج القوي والخلفية الوردية المضيئة لـ Almost Pink Glow */
        .mode-almost-glow {
            background: radial-gradient(circle, #ff69b4 0%, #ff1493 100%) !important;
            animation: pulseGlow 2s infinite alternate;
        }
        .mode-almost-glow #bg-layer { display: none !important; }
        .mode-almost-glow .overlay { background: rgba(0, 0, 0, 0.05) !important; }

        @keyframes pulseGlow {
            0% { box-shadow: inset 0 0 50px rgba(255,255,255,0.2); }
            100% { box-shadow: inset 0 0 100px rgba(255,255,255,0.5); }
        }

        /* الـ Badge الرئيسي لعرض اسم النتيجة */
        .result-badge {
            font-size: 3rem;
            font-weight: 900;
            color: #ff1493;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            animation: fadeInResult 1s cubic-bezier(0.215, 0.610, 0.355, 1) forwards;
        }

        /* الـ Score لعرض النسبة المئوية العشرية */
        .result-score {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333333;
            margin-top: 10px;
            animation: fadeInResult 1.4s cubic-bezier(0.215, 0.610, 0.355, 1) forwards;
        }

        /* ستايل مخصص للخط للتأكيد على الـ Strong Glow */
        .strong-glow-text {
            color: #ffffff !important;
            text-shadow: 0 0 20px #ffffff, 0 0 40px #ff1493, 0 0 60px #ff1493 !important;
        }
        
        .strong-glow-score {
            color: #ffffff !important;
            text-shadow: 0 0 10px rgba(255,255,255,0.8) !important;
        }

        @keyframes fadeInResult {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-slider" id="bg-layer"></div>
    <!-- تم إضافة كلاس welcome-overlay لجعل واجهة الفيديو بيضاء بدون قناع مظلم -->
    <div class="overlay welcome-overlay" id="overlay-layer"></div>

    <canvas id="smokeCanvas"></canvas>

    <div class="quiz-container" id="quiz-box">
        
        <div id="welcome-screen" class="welcome-screen">
            <!-- تمت إزالة التشغيل التلقائي المبدئي لكي يبدأ بدقة عند الضغط على Start -->
            <video class="welcome-video" loop playsinline id="introVideo">
                <source src="intro.mp4" type="video/mp4">
                متصفحك لا يدعم تشغيل الفيديو.
            </video>
            <button class="start-btn" id="start-quiz-btn">START</button>
        </div>

        <div id="question-screen" class="hidden">
            <h2 id="question-text">جاري تحضير تجربة الـ Spa...</h2>
            <div class="options-list" id="options-container"></div>
        </div>

        <div id="result-screen" class="hidden">
            <div id="badge-container" class="result-badge"></div>
            <div id="score-container" class="result-score"></div>
        </div>
    </div>

    <script>
        const clickSound = new Audio('click.mp3');
        clickSound.volume = 0.5;

        let isAudioUnlocked = false;

        function unlockMobileAudio() {
            if (isAudioUnlocked) return;
            const playPromise = clickSound.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    clickSound.pause();
                    clickSound.currentTime = 0;
                }).catch(err => {});
            }
            isAudioUnlocked = true;
        }

        // تم تحديث الأسكورات داخل المصفوفة مباشرة بناءً على تقسيمك الجديد لحسابها ديناميكياً
        const quizData = [
            {
                question: "كم مرة تشرب قهوة او شاي يوميا؟",
                options: ["ولا مرة", "مرة او مرتان", "من ثلاث الى خمس مرات", "عايش عليها"],
                scores: [100, 70, 35, 0], // نظام السؤال الأول
                image: "bg1.png"
            },
            {
                question: "هل تدخن؟",
                options: ["لا", "احيانا", "يوميا", "عدة باكيتات باليوم"],
                scores: [100, 70, 35, 0], // نظام السؤال الثاني
                image: "bg2.png"
            },
            {
                question: "هل تشرب ماء كافي يوميا؟",
                options: ["نعم", "أحياناً", "لا"],
                scores: [100, 50, 0], // باقي الأسئلة
                image: "bg3.png"
            },
            {
                question: "احد عرض عليك علكة او نعناع بشكل مفاجئ؟",
                options: ["لا", "احيانا", "مرات متكررة"],
                scores: [100, 50, 0],
                image: "bg4.png"
            },
            {
                question: "تحس بجفاف بالفم؟",
                options: ["نادرا", "احيانا", "دائما"],
                scores: [100, 50, 0],
                image: "bg5.png"
            },
            {
                question: "تحس الناس تبتعد و انت تحجي؟",
                options: ["لا", "يمكن", "صارت اكثر من مرة"],
                scores: [100, 50, 0],
                image: "bg6.png"
            }
        ];

        let currentQuestionIndex = 0;
        let totalScore = 0;

        const quizBox = document.getElementById('quiz-box');
        const bgLayer = document.getElementById('bg-layer');
        const overlayLayer = document.getElementById('overlay-layer');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        
        const welcomeScreen = document.getElementById('welcome-screen');
        const questionScreen = document.getElementById('question-screen');
        const resultScreen = document.getElementById('result-screen');
        const badgeContainer = document.getElementById('badge-container');
        const scoreContainer = document.getElementById('score-container');
        const smokeCanvas = document.getElementById('smokeCanvas');
        const startQuizBtn = document.getElementById('start-quiz-btn');
        const introVideo = document.getElementById('introVideo');

        startQuizBtn.addEventListener('click', () => {
            unlockMobileAudio();
            
            // يبدأ الفيديو بالعمل فوراً عند الضغط على زر START
            introVideo.muted = false;
            introVideo.currentTime = 0;
            introVideo.play().catch(e => { console.log("Video playback error:", e) });

            setTimeout(() => {
                quizBox.classList.add('quiz-pull-out');
            }, 2500); 

            setTimeout(() => {
                welcomeScreen.classList.add('hidden');
                questionScreen.classList.remove('hidden');
                
                // إزالة القناع الشفاف المخصص للترحيب ليعود القناع الطبيعي للأسئلة لضمان وضوح النصوص فوق الصور
                overlayLayer.classList.remove('welcome-overlay');
                
                quizBox.classList.remove('quiz-pull-out');
                quizBox.classList.add('quiz-pull-in-prepare');
                
                introVideo.pause();

                setTimeout(() => {
                    quizBox.style.transition = '';
                    loadQuestion();
                }, 50);
            }, 3000); 
        });

        function loadQuestion() {
            const currentData = quizData[currentQuestionIndex];
            
            quizBox.classList.remove('quiz-pull-out', 'quiz-pull-in-prepare');
            bgLayer.classList.remove('bg-blur-effect');
            
            bgLayer.style.backgroundImage = `url('${currentData.image}')`;
            questionText.innerText = currentData.question;
            optionsContainer.innerHTML = '';

            currentData.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.classList.add('option-btn');
                button.innerText = option;
                button.addEventListener('click', (e) => handleAnswer(e, index));
                optionsContainer.appendChild(button);
            });
        }

        function handleAnswer(e, selectedIndex) {
            const selectedButton = e.target;
            const allButtons = optionsContainer.querySelectorAll('.option-btn');
            const currentData = quizData[currentQuestionIndex];

            totalScore += currentData.scores[selectedIndex];
            
            clickSound.currentTime = 0;
            clickSound.play().catch(e => {});

            selectedButton.classList.add('btn-selected');

            allButtons.forEach(btn => {
                if (btn !== selectedButton) btn.classList.add('disabled');
            });

            setTimeout(() => {
                quizBox.classList.add('quiz-pull-out');
                bgLayer.classList.add('bg-blur-effect');

                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < quizData.length) {
                        quizBox.style.transition = 'none';
                        quizBox.classList.remove('quiz-pull-out');
                        quizBox.classList.add('quiz-pull-in-prepare');
                        
                        setTimeout(() => {
                            quizBox.style.transition = '';
                            loadQuestion();
                        }, 50);
                    } else {
                        showResults();
                    }
                }, 600);
            }, 600);
        }

        function triggerConfetti() {
            var duration = 4 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 6, angle: 60, spread: 60, origin: { x: 0, y: 0.8 } });
                confetti({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1, y: 0.8 } });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }

        // تم تطوير نظام الدخان والجزيئات ليدعم الكثافة العالية (Dense Particles) عند الطلب
        function triggerCustomPinkSmoke(denseMode = false) {
            smokeCanvas.style.opacity = "1";
            const ctx = smokeCanvas.getContext('2d');
            
            function resizeCanvas() {
                smokeCanvas.width = window.innerWidth;
                smokeCanvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const smokeParticles = [];
            const sparkleParticles = [];
            
            // إذا كانت الوضعية كثيفة (Almost Pink Glow) نضاعف عدد الجزيئات لزيادة التأثير البصري
            const smokeCount = denseMode ? 70 : 35;
            const sparkleCount = denseMode ? 80 : 25;

            class SmokeParticle {
                constructor() { this.reset(true); }
                reset(init = false) {
                    this.x = init ? Math.random() * (smokeCanvas.width * 0.4) : -Math.random() * 50;
                    this.y = Math.random() * smokeCanvas.height;
                    this.size = Math.random() * 140 + 110;
                    this.speedX = denseMode ? (Math.random() * 1.2 + 0.5) : (Math.random() * 0.7 + 0.3);
                    this.speedY = Math.random() * 0.4 - 0.2;
                    this.opacity = denseMode ? (Math.random() * 0.4 + 0.15) : (Math.random() * 0.24 + 0.08); 
                    this.vs = Math.random() * 0.1 + 0.05;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.size += this.vs;
                    if (this.x > smokeCanvas.width * 0.6) { this.opacity -= 0.003; }
                    if (this.x > smokeCanvas.width || this.opacity <= 0) { this.reset(); }
                }
                draw() {
                    if (this.opacity <= 0) return;
                    ctx.beginPath();
                    let gradient = ctx.createRadialGradient(this.x, this.y, this.size * 0.05, this.x, this.y, this.size);
                    
                    if(denseMode) {
                        // ألوان مضيئة وساطعة أكثر للـ Glow القوي
                        gradient.addColorStop(0, `rgba(255, 20, 147, ${this.opacity})`);
                        gradient.addColorStop(0.3, `rgba(255, 105, 180, ${this.opacity * 0.6})`);
                        gradient.addColorStop(0.7, `rgba(255, 192, 203, ${this.opacity * 0.2})`);
                    } else {
                        gradient.addColorStop(0, `rgba(235, 20, 147, ${this.opacity})`); 
                        gradient.addColorStop(0.5, `rgba(255, 105, 180, ${this.opacity * 0.4})`);
                    }
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = gradient;
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            class SparkleParticle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * (smokeCanvas.width * 0.5);
                    this.y = Math.random() * smokeCanvas.height;
                    this.size = denseMode ? (Math.random() * 4 + 1.5) : (Math.random() * 2.5 + 1);
                    this.speedX = denseMode ? (Math.random() * 2 + 0.8) : (Math.random() * 1.1 + 0.4);
                    this.speedY = Math.random() * 0.6 - 0.3;
                    this.opacity = Math.random() * 0.9 + 0.3;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x > smokeCanvas.width * 0.6) { this.opacity -= 0.015; }
                    if (this.x > smokeCanvas.width || this.opacity <= 0) { this.reset(); }
                }
                draw() {
                    ctx.beginPath();
                    ctx.fillStyle = denseMode ? `rgba(255, 255, 255, ${this.opacity})` : `rgba(219, 0, 114, ${this.opacity})`; 
                    ctx.shadowBlur = denseMode ? 12 : 8;
                    ctx.shadowColor = "#ff1493";
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            for (let i = 0; i < smokeCount; i++) smokeParticles.push(new SmokeParticle());
            for (let i = 0; i < sparkleCount; i++) sparkleParticles.push(new SparkleParticle());

            function animate() {
                ctx.clearRect(0, 0, smokeCanvas.width, smokeCanvas.height);
                smokeParticles.forEach(p => { p.update(); p.draw(); });
                sparkleParticles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();
        }

        function showResults() {
            questionScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            quizBox.style.transition = '';
            quizBox.classList.remove('quiz-pull-out', 'quiz-pull-in-prepare');
            
            // حساب المعدل النهائي الفعلي المقسم على 6 مع تقريب لمرتبة عشرية واحدة
            let finalCalculatedScore = (totalScore / 6).toFixed(1);
            
            let resultWord = "";
            
            // تطبيق الشروط الجديدة للنطاقات الرقمية والنتائج والمؤثرات البصرية
            if (finalCalculatedScore > 91 && finalCalculatedScore <= 100) {
                // النتيجة: Pink Glow -> خلفية بيضاء بالكامل + مؤثرات احتفال
                document.body.classList.add('mode-white-bg');
                resultWord = "Pink Glow";
                triggerConfetti();
                
            } else if (finalCalculatedScore >= 89 && finalCalculatedScore <= 91) {
                // النتيجة: Almost Pink Glow -> خلفية وردية مضيئة + توهج قوي + جزيئات كثيفة جداً
                document.body.classList.add('mode-almost-glow');
                badgeContainer.classList.add('strong-glow-text');
                scoreContainer.classList.add('strong-glow-score');
                resultWord = "Almost Pink Glow ✨";
                triggerCustomPinkSmoke(true); // تشغيل الوضع الكثيف للجزيئات والتوهج القوي
                
            } else if (finalCalculatedScore >= 70 && finalCalculatedScore <= 88) {
                // النتيجة: Pink Balance -> الحفاظ على مؤثرات الدخان المعتادة
                resultWord = "Pink Balance";
                triggerCustomPinkSmoke(false);
                
            } else if (finalCalculatedScore < 70) {
                // النتيجة: Pink Revival -> الحفاظ على مؤثرات الدخان المعتادة
                resultWord = "Pink Revival";
                triggerCustomPinkSmoke(false);
            }
            
            // طباعة النتيجة النهائية والنسبة العشرية المحسوبة بدقة
            badgeContainer.innerText = resultWord;
            scoreContainer.innerText = `${finalCalculatedScore}%`;
        }
    </script>
</body>
</html>
