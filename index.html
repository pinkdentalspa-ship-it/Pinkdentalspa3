<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Dental Spa - Enter the PINK world</title>
    <link href="https://fonts.googleapis.com/css2 family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            background-color: #1a0511; /* خلفية داكنة لتبرز جمال الدخان اليرمجي */
            overflow: hidden;
            transition: background 1s ease, background-color 1s ease;
        }

        /* حاوية الـ Three.js الشاشية للدخان */
        #threeCanvasContainer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            transition: opacity 1s ease-in-out;
            opacity: 1;
        }

        .bg-slider {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            opacity: 0; 
            filter: blur(0px);
            transform: scale(1);
            transition: filter 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 1s ease;
        }

        .bg-blur-effect {
            filter: blur(4px);
            transform: scale(1.03);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.02); 
            z-index: 2;
            transition: background 1s ease;
        }

        .welcome-overlay {
            background: transparent !important;
        }

        /* كانفاس إضافي منفصل وخفيف مخصص فقط لومضات السباركلز الفخمة فوق الدخان */
        #sparkleCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3; 
            pointer-events: none; 
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
        }

        .quiz-container {
            position: relative;
            z-index: 4;
            background: transparent; 
            border: none;
            padding: 20px;
            width: 90%;
            max-width: 480px;
            box-shadow: none;
            text-align: center;
            transform: scale(1);
            opacity: 1;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease-in-out;
        }

        .card-box {
            background: #ffffff;
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 25px 60px rgba(180, 20, 100, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .welcome-video {
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            outline: none;
            background-color: #000;
            object-fit: cover;
            margin-bottom: 35px;
        }

        .main-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2.4rem;
            color: #2b353c;
            font-weight: 600;
            line-height: 1.25;
            margin-bottom: 25px;
            text-shadow: none;
            direction: ltr;
        }

        .sub-title {
            font-size: 1.05rem;
            color: #9aa4ac;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 500;
            max-width: 90%;
            direction: ltr;
        }

        .start-btn {
            background: linear-gradient(to left, #ff00cc, #ffc0cb);
            border: none;
            padding: 16px 45px;
            border-radius: 20px;
            color: #ffffff; 
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255, 0, 204, 0.25);
            direction: ltr;
            width: 90%;
            max-width: 290px;
        }

        .start-btn .heart-icon {
            font-size: 1.1rem;
            display: inline-block;
            line-height: 1;
        }

        .start-btn:hover, .start-btn:active {
            transform: scale(1.03);
            box-shadow: 0 12px 30px rgba(255, 0, 204, 0.35);
            opacity: 0.95;
        }

        .option-btn {
            position: relative;
            z-index: 100;
            background: rgba(255, 20, 147, 0.18); 
            border: 1px solid rgba(255, 20, 147, 0.4); 
            padding: 20px 24px;
            border-radius: 20px;
            color: #ffffff; 
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            text-align: right;
            width: 100%;
            outline: none;
        }

        .option-btn:hover, .option-btn:active {
            background: rgba(255, 20, 147, 0.45); 
            border-color: rgba(255, 20, 147, 0.8);
            color: #ffffff;
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(255, 20, 147, 0.25);
        }

        .quiz-pull-out {
            transform: scale(0.92);
            opacity: 0;
        }

        .quiz-pull-in-prepare {
            transform: scale(1.08);
            opacity: 0;
            transition: none;
        }

        h2 {
            margin-bottom: 40px;
            font-size: 1.5rem;
            line-height: 1.6;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 1px 3px rgba(0, 0, 0, 0.9);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @keyframes glassSelected {
            0% { background: rgba(255, 20, 147, 0.45); color: #ffffff;}
            100% { background: #ff1493; border-color: #ff1493; color: #ffffff; text-shadow: none; transform: scale(1.04); box-shadow: 0 10px 25px rgba(255, 20, 147, 0.35);}
        }

        .btn-selected {
            animation: glassSelected 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            pointer-events: none;
        }

        .disabled {
            pointer-events: none;
            opacity: 0.15;
            transform: scale(0.96);
        }

        .hidden {
            display: none !important;
        }

        /* ستايلات شاشات النتائج النهائية الملونة */
        .mode-glow-bg {
            background: radial-gradient(circle, #ffc0cb 0%, #ff69b4 100%) !important;
            box-shadow: inset 0 0 80px rgba(255, 255, 255, 0.6);
        }

        .mode-balance-bg {
            background: linear-gradient(135deg, #2c1a24 0%, #ff69b4 100%) !important;
        }

        .mode-revival-bg {
            background: radial-gradient(circle, #1a0813 0%, #4a1535 100%) !important;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
        }

        .mode-glow-bg #bg-layer, .mode-balance-bg #bg-layer, .mode-revival-bg #bg-layer {
            display: none !important;
        }

        .result-intro {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ff1493;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .result-badge {
            font-size: 3.4rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.25);
            margin-bottom: 5px;
        }

        .result-score {
            font-size: 1.4rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 25px;
        }

        .result-description {
            font-size: 1.05rem;
            font-weight: 500;
            color: #ffffff;
            line-height: 1.6;
            padding: 0 15px;
            margin-bottom: 35px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.15);
            direction: ltr; 
            text-align: center;
        }

        .result-cta-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.5;
            direction: ltr;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            padding: 0 10px;
            animation: softPulse 2.5s infinite ease-in-out;
        }

        @keyframes softPulse {
            0% { opacity: 0.85; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.01); }
            100% { opacity: 0.85; transform: scale(1); }
        }

        #result-screen {
            animation: fadeInResult 0.8s cubic-bezier(0.215, 0.610, 0.355, 1) forwards;
        }

        @keyframes fadeInResult {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="threeCanvasContainer"></div>

    <div class="bg-slider" id="bg-layer"></div>
    <div class="overlay welcome-overlay" id="overlay-layer"></div>

    <canvas id="sparkleCanvas"></canvas>

    <div class="quiz-container" id="quiz-box">
        
        <div id="welcome-screen" class="welcome-screen">
            <div class="card-box">
                <video class="welcome-video" id="introVideo" playsinline>
                    <source src="intro.mp4" type="video/mp4">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
                <div class="main-title">Enter the PINK<br>world</div>
                <div class="sub-title">Not everything needs to be said loud...Some things are only Whispered</div>
                <button class="start-btn" id="start-quiz-btn">
                    <span>Pink Whisper</span>
                    <span class="heart-icon">🤍</span>
                </button>
            </div>
        </div>

        <div id="question-screen" class="hidden">
            <h2 id="question-text">جاري تحضير تجربة الـ Spa...</h2>
            <div class="options-list" id="options-container"></div>
        </div>

        <div id="result-screen" class="hidden">
            <div class="result-intro">Your Whisper result is:</div>
            <div id="badge-container" class="result-badge"></div>
            <div id="score-container" class="result-score"></div>
            <div id="description-container" class="result-description"></div>
            <div class="result-cta-text">
                Send us your Whisper result (a screenshot)<br>and unlock your Pink Spa experience 💗
            </div>
        </div>
    </div>

    <script>
        const clickSound = new Audio('click.mp3');
        clickSound.volume = 0.5;

        const welcomeSound = new Audio('welcome.mp3');
        welcomeSound.volume = 0.7; 

        let isAudioUnlocked = false;

        function unlockMobileAudio() {
            if (isAudioUnlocked) return;
            [clickSound, welcomeSound].forEach(sound => {
                const playPromise = sound.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        sound.pause();
                        sound.currentTime = 0;
                    }).catch(err => {});
                }
            });
            isAudioUnlocked = true;
        }

        const quizData = [
            { question: "كم مرة تشرب قهوة او شاي يوميا؟", options: ["ولا مرة", "مرة او مرتان", "من ثلاث الى خمس مرات", "عايش عليها"], scores: [100, 70, 35, 0], image: "bg1.png" },
            { question: "هل تدخن؟", options: ["لا", "احيانا", "يوميا", "عدة باكيتات باليوم"], scores: [100, 70, 35, 0], image: "bg2.png" },
            { question: "هل تشرب ماء كافي يوميا؟", options: ["نعم", "أحياناً", "لا"], scores: [100, 50, 0], image: "bg3.png" },
            { question: "احد عرض عليك علكة او نعناع بشكل مفاجئ؟", options: ["لا", "احيانا", "مرات متكررة"], scores: [100, 50, 0], image: "bg4.png" },
            { question: "تحس بجفاف بالفم؟", options: ["نادرا", "احيانا", "دائما"], scores: [100, 50, 0], image: "bg5.png" },
            { question: "تحس الناس تبتعد و انت تحجي؟", options: ["لا", "يمكن", "صارت اكثر من مرة"], scores: [100, 50, 0], image: "bg6.png" }
        ];

        function preloadImages() {
            quizData.forEach(data => { const img = new Image(); img.src = data.image; });
        }
        preloadImages();

        let currentQuestionIndex = 0;
        let totalScore = 0;
        let sparkleAnimationId = null; 

        const quizBox = document.getElementById('quiz-box');
        const bgLayer = document.getElementById('bg-layer');
        const overlayLayer = document.getElementById('overlay-layer');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        
        const welcomeScreen = document.getElementById('welcome-screen');
        const questionScreen = document.getElementById('question-screen');
        const resultScreen = document.getElementById('result-screen');
        const badgeContainer = document.getElementById('badge-container');
        const scoreContainer = document.getElementById('score-container');
        const descriptionContainer = document.getElementById('description-container');
        const sparkleCanvas = document.getElementById('sparkleCanvas');
        const startQuizBtn = document.getElementById('start-quiz-btn');
        const introVideo = document.getElementById('introVideo');
        const threeContainer = document.getElementById('threeCanvasContainer');

        // --- كود برمجة الـ Three.js والـ GLSL Shader لمحاكاة الدخان الفيزيائي الكثيف ---
        let scene, camera, renderer, smokeMaterial, smokeMesh;
        let clock = new THREE.Clock();

        // كود الـ Vertex Shader (تحديد الموضع والأبعاد البرمجية للـ Pixels)
        const vertexShaderCode = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        // كود الـ Fragment Shader (المعادلة الرياضية العميقة لتوليد غاز الدخان المتداخل ولونه الوردي الفاخر)
        const fragmentShaderCode = `
            uniform vec2 u_resolution;
            uniform float u_time;
            varying vec2 vUv;

            // دالة رياضية لتوليد عشوائية النسيج العضوي (Noise Function)
            float noise(in vec2 p) {
                return sin(p.x * 2.0) * sin(p.y * 2.0) + cos(p.x * 0.5 + u_time * 0.1) * sin(p.y * 1.2 - u_time * 0.05);
            }

            // تجميع طبقات الـ Noise فوق بعضها لمحاكاة كثافة الدخان المتصاعد (Fractal Brownian Motion)
            float fbm(in vec2 p) {
                float v = 0.0;
                float amt = 0.5;
                for (int i = 0; i < 4; i++) {
                    v += amt * noise(p);
                    p *= 2.1;
                    amt *= 0.5;
                }
                return v;
            }

            void main() {
                // ضبط النسبة وعمل Slow motion وتدفق دائم من اليسار لليمن
                vec2 st = gl_FragCoord.xy / u_resolution.xy;
                st.x *= u_resolution.x / u_resolution.y;
                
                vec2 uv = st * 2.5;
                uv.x -= u_time * 0.06; // سرعة الـ Slow mo الفخمة من اليسار لليمين
                
                // حسابات التداخل الغازي للدخان
                vec2 q = vec2(0.0);
                q.x = fbm(uv + vec2(0.0, 0.0));
                q.y = fbm(uv + vec2(1.0, 1.0));

                vec2 r = vec2(0.0);
                r.x = fbm(uv + 1.0 * q + vec2(1.7, 9.2) + 0.15 * u_time);
                r.y = fbm(uv + 1.0 * q + vec2(8.3, 2.8) + 0.08 * u_time);

                float f = fbm(uv + r);
                
                // درجات الألوان الفخمة المستوحاة من صورتك (وردي غامق، بنفسجي خفيف، وأطراف ناعمة)
                vec3 color1 = vec3(0.85, 0.10, 0.49); // الفوشيا الملكي الدافئ
                vec3 color2 = vec3(0.42, 0.05, 0.26); // البنفسجي المخملي الغامق
                vec3 color3 = vec3(0.98, 0.70, 0.82); // الوردي الناعم للأطراف

                vec3 finalColor = mix(color1, color2, clamp(length(q), 0.0, 1.0));
                finalColor = mix(finalColor, color3, clamp(length(r.x), 0.0, 1.0));
                
                // تنعيم الكثافة وتفتيح السنتر قليلاً مثل الصورة تماماً
                float density = clamp(f * f * 3.5 + 0.2, 0.0, 1.0);
                
                gl_FragColor = vec4(finalColor, density * 0.95);
            }
        `;

        function initThreeSmoke() {
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            threeContainer.appendChild(renderer.domElement);

            // إعداد المتغيرات الموحدة للـ Shader (الوقت ومقاسات الشاشة الحية)
            let uniforms = {
                u_time: { value: 1.0 },
                u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            };

            smokeMaterial = new THREE.ShaderMaterial({
                vertexShader: vertexShaderCode,
                fragmentShader: fragmentShaderCode,
                uniforms: uniforms,
                transparent: true
            });

            const geometry = new THREE.PlaneGeometry(2, 2);
            smokeMesh = new THREE.Mesh(geometry, smokeMaterial);
            scene.add(smokeMesh);

            animateThreeSmoke();
        }

        function animateThreeSmoke() {
            requestAnimationFrame(animateThreeSmoke);
            if(smokeMaterial) {
                smokeMaterial.uniforms.u_time.value = clock.getElapsedTime();
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if(renderer && smokeMaterial) {
                renderer.setSize(window.innerWidth, window.innerHeight);
                smokeMaterial.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
            }
            sparkleCanvas.width = window.innerWidth;
            sparkleCanvas.height = window.innerHeight;
        });

        // تشغيل نظام الدخان ثلاثي الأبعاد المتطور فوراً
        initThreeSmoke();

        // تشغيل ومضات النجوم المستقلة
        function initSparkles() {
            sparkleCanvas.width = window.innerWidth;
            sparkleCanvas.height = window.innerHeight;
            const ctx = sparkleCanvas.getContext('2d');
            const particles = [];

            class SparkleParticle {
                constructor() {
                    this.x = Math.random() * sparkleCanvas.width;
                    this.y = Math.random() * sparkleCanvas.height;
                    this.size = Math.random() * 2.5 + 1;
                    this.speedX = Math.random() * 0.1 - 0.05;
                    this.speedY = -(Math.random() * 0.15 + 0.05); 
                    this.opacity = Math.random() * 0.6 + 0.3;
                    this.phase = Math.random() * 100;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.y < -20) {
                        this.y = sparkleCanvas.height + 20;
                        this.x = Math.random() * sparkleCanvas.width;
                    }
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    let pulseOpacity = this.opacity * (0.4 + Math.sin(Date.now() * 0.003 + this.phase) * 0.6);
                    ctx.fillStyle = `rgba(255, 255, 255, ${pulseOpacity})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#ffffff";
                    ctx.beginPath();
                    for (let i = 0; i < 4; i++) {
                        ctx.rotate(Math.PI / 2);
                        ctx.lineTo(0, this.size * 4.5);
                        ctx.lineTo(this.size * 0.9, 0);
                    }
                    ctx.fill();
                    ctx.restore();
                }
            }

            for(let i=0; i<25; i++) particles.push(new SparkleParticle());

            function loop() {
                ctx.clearRect(0, 0, sparkleCanvas.width, sparkleCanvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                sparkleAnimationId = requestAnimationFrame(loop);
            }
            loop();
        }
        initSparkles();

        // --- التحكم بتدفق الأسئلة وبدء تجربة المستخدم ---
        startQuizBtn.addEventListener('click', () => {
            unlockMobileAudio();
            
            // تلميس واختفاء الدخان المبرمجة والبريق تدريجياً ليبقى الفيديو نقياً تماماً
            threeContainer.style.opacity = "0";
            sparkleCanvas.style.opacity = "0"; 

            introVideo.muted = false;
            introVideo.currentTime = 0;
            introVideo.play().catch(e => {});

            setTimeout(() => {
                quizBox.classList.add('quiz-pull-out');
            }, 2500); 
        });

        introVideo.addEventListener('ended', () => {
            welcomeScreen.classList.add('hidden');
            questionScreen.classList.remove('hidden');
            overlayLayer.classList.remove('welcome-overlay');
            
            threeContainer.classList.add('hidden'); 
            bgLayer.style.opacity = "1";

            quizBox.classList.remove('quiz-pull-out');
            quizBox.classList.add('quiz-pull-in-prepare');
            
            welcomeSound.currentTime = 0;
            welcomeSound.play().catch(err => {});

            setTimeout(() => {
                quizBox.style.transition = '';
                loadQuestion();
            }, 50);
        });

        function loadQuestion() {
            const currentData = quizData[currentQuestionIndex];
            quizBox.classList.remove('quiz-pull-out', 'quiz-pull-in-prepare');
            bgLayer.classList.remove('bg-blur-effect');
            
            bgLayer.style.backgroundImage = `url('${currentData.image}')`;
            questionText.innerText = currentData.question;
            optionsContainer.innerHTML = '';

            currentData.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.classList.add('option-btn');
                button.innerText = option;
                button.addEventListener('click', (e) => handleAnswer(e, index));
                optionsContainer.appendChild(button);
            });
        }

        function handleAnswer(e, selectedIndex) {
            const selectedButton = e.target;
            const allButtons = optionsContainer.querySelectorAll('.option-btn');
            const currentData = quizData[currentQuestionIndex];

            totalScore += currentData.scores[selectedIndex];
            clickSound.currentTime = 0;
            clickSound.play().catch(e => {});
            selectedButton.classList.add('btn-selected');

            allButtons.forEach(btn => { if (btn !== selectedButton) btn.classList.add('disabled'); });

            setTimeout(() => {
                quizBox.classList.add('quiz-pull-out');
                bgLayer.classList.add('bg-blur-effect');

                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < quizData.length) {
                        quizBox.style.transition = 'none';
                        quizBox.classList.remove('quiz-pull-out');
                        quizBox.classList.add('quiz-pull-in-prepare');
                        setTimeout(() => {
                            quizBox.style.transition = '';
                            loadQuestion();
                        }, 50);
                    } else {
                        showResults();
                    }
                }, 600);
            }, 600);
        }

        function triggerFastConfetti() {
            var duration = 2 * 1000; 
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 12, angle: 60, spread: 65, origin: { x: 0, y: 0.85 } });
                confetti({ particleCount: 12, angle: 120, spread: 65, origin: { x: 1, y: 0.85 } });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }

        function showResults() {
            questionScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            quizBox.style.transition = '';
            quizBox.classList.remove('quiz-pull-out', 'quiz-pull-in-prepare');
            overlayLayer.classList.add('welcome-overlay'); 
            
            let finalCalculatedScore = (totalScore / 6).toFixed(1);
            let resultWord = "";
            let resultDescription = "";
            
            if (finalCalculatedScore >= 91.1 && finalCalculatedScore <= 100.0) {
                document.body.classList.add('mode-glow-bg');
                resultWord = "Pink Glow";
                resultDescription = "Freshness, confidence, and care are clearly part of your daily whisper energy, a little care keeps it unforgettable.";
                triggerFastConfetti();
            } else if (finalCalculatedScore >= 70.0 && finalCalculatedScore <= 91.0) {
                document.body.classList.add('mode-balance-bg');
                resultWord = "Pink Balance";
                resultDescription = "small daily details may be affecting your whisper freshness and confidence more than you notice, it only needs the right touch.";
            } else if (finalCalculatedScore < 70.0) {
                document.body.classList.add('mode-revival-bg');
                resultWord = "Pink Revival";
                resultDescription = "Your whisper is ready for a fresh beginning, one step could unlock your full Pink Glow.";
            }
            
            badgeContainer.innerText = resultWord;
            scoreContainer.innerText = `${finalCalculatedScore}%`;
            descriptionContainer.innerText = resultDescription;
        }
    </script>
</body>
</html>
