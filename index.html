        /* =====================================================
           PARTICLE SYSTEM
        ===================================================== */

        const particleSystem = {

            canvas:
                particleCanvas,

            ctx:
                null,

            particles:
                [],


            init() {

                this.canvas.width =
                    window.innerWidth;

                this.canvas.height =
                    window.innerHeight;

                this.ctx =
                    this.canvas.getContext("2d");

            },


            burstParticles(
                x,
                y,
                count = 30
            ) {

                for (
                    let i = 0;
                    i < count;
                    i++
                ) {

                    const angle =
                        (Math.PI * 2 * i) /
                        count;

                    const velocity =
                        3 +
                        Math.random() * 3;

                    this.particles.push({

                        x: x,

                        y: y,

                        vx:
                            Math.cos(angle) *
                            velocity,

                        vy:
                            Math.sin(angle) *
                            velocity,

                        life: 1,

                        size:
                            3 +
                            Math.random() * 3,

                        color:
                            `hsl(${
                                320 +
                                Math.random() * 40
                            }, 100%, 70%)`

                    });

                }

            },


            update() {

                if (!this.ctx) return;

                this.ctx.clearRect(
                    0,
                    0,
                    this.canvas.width,
                    this.canvas.height
                );


                for (
                    let i =
                        this.particles.length - 1;

                    i >= 0;

                    i--
                ) {

                    const p =
                        this.particles[i];

                    p.x += p.vx;

                    p.y += p.vy;

                    p.vy += 0.15;

                    p.life -= 0.02;


                    if (p.life <= 0) {

                        this.particles.splice(
                            i,
                            1
                        );

                        continue;
                    }


                    this.ctx.save();

                    this.ctx.globalAlpha =
                        p.life;

                    this.ctx.fillStyle =
                        p.color;

                    this.ctx.beginPath();

                    this.ctx.arc(
                        p.x,
                        p.y,
                        p.size,
                        0,
                        Math.PI * 2
                    );

                    this.ctx.fill();

                    this.ctx.restore();

                }

            },


            animate() {

                this.update();

                requestAnimationFrame(
                    () =>
                        this.animate()
                );

            }

        };


        particleSystem.init();

        particleSystem.animate();


        /* =====================================================
           THREE.JS SMOKE
        ===================================================== */

        let renderer,
            scene,
            camera,
            smokeMaterial,
            clock;


        function initThreeSmoke() {

            if (
                typeof THREE ===
                "undefined"
            ) {
                return;
            }


            try {

                scene =
                    new THREE.Scene();


                camera =
                    new THREE.Camera();


                renderer =
                    new THREE.WebGLRenderer({
                        alpha: true,
                        antialias: true
                    });


                renderer.setPixelRatio(
                    Math.min(
                        window.devicePixelRatio || 1,
                        2
                    )
                );


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );


                threeContainer.appendChild(
                    renderer.domElement
                );


                clock =
                    new THREE.Clock();


                const textureLoader =
                    new THREE.TextureLoader();


                const smokeTexture =
                    textureLoader.load(
                        "1000455138.jpg",
                        texture => {

                            texture.wrapS =
                                texture.wrapT =
                                    THREE.RepeatWrapping;

                        }
                    );


                const uniforms = {

                    u_time: {
                        value: 0
                    },

                    u_resolution: {
                        value:
                            new THREE.Vector2(
                                window.innerWidth,
                                window.innerHeight
                            )
                    },

                    u_texture: {
                        value:
                            smokeTexture
                    }

                };


                smokeMaterial =
                    new THREE.ShaderMaterial({

                        vertexShader: `
                            varying vec2 vUv;

                            void main() {

                                vUv = uv;

                                gl_Position =
                                    vec4(
                                        position,
                                        1.0
                                    );
                            }
                        `,


                        fragmentShader: `

                            uniform float u_time;

                            uniform vec2 u_resolution;

                            uniform sampler2D u_texture;

                            varying vec2 vUv;


                            void main() {

                                vec2 uv =
                                    vUv;

                                vec2 textureUv =
                                    uv;


                                textureUv.x +=
                                    sin(
                                        u_time * 0.035 +
                                        textureUv.y * 2.0
                                    ) * 0.018;


                                textureUv.y +=
                                    sin(
                                        u_time * 0.025 +
                                        textureUv.x * 2.0
                                    ) * 0.012;


                                vec4 tex =
                                    texture2D(
                                        u_texture,
                                        textureUv
                                    );


                                float luminance =
                                    dot(
                                        tex.rgb,
                                        vec3(
                                            0.299,
                                            0.587,
                                            0.114
                                        )
                                    );


                                vec3 pink =
                                    vec3(
                                        0.95,
                                        0.08,
                                        0.42
                                    );


                                vec3 darkPink =
                                    vec3(
                                        0.12,
                                        0.005,
                                        0.04
                                    );


                                vec3 color =
                                    mix(
                                        darkPink,
                                        pink,
                                        smoothstep(
                                            0.18,
                                            0.82,
                                            luminance
                                        ) * 0.72
                                    );


                                gl_FragColor =
                                    vec4(
                                        color,
                                        0.72 +
                                        luminance * 0.18
                                    );

                            }

                        `,

                        uniforms:
                            uniforms,

                        transparent:
                            true

                    });


                scene.add(

                    new THREE.Mesh(
                        new THREE.PlaneGeometry(
                            2,
                            2
                        ),
                        smokeMaterial
                    )

                );


                (function animateSmoke() {

                    requestAnimationFrame(
                        animateSmoke
                    );


                    if (
                        smokeMaterial &&
                        clock
                    ) {

                        smokeMaterial
                            .uniforms
                            .u_time
                            .value =
                                clock.getElapsedTime();


                        renderer.render(
                            scene,
                            camera
                        );

                    }

                })();


            } catch (error) {

                console.error(
                    "Three.js error:",
                    error
                );

                threeContainer.style.display =
                    "none";

            }

        }


        /* =====================================================
           SPARKLES
        ===================================================== */

        function initSparkles() {

            sparkleCanvas.width =
                window.innerWidth;

            sparkleCanvas.height =
                window.innerHeight;


            const ctx =
                sparkleCanvas.getContext("2d");


            if (!ctx) return;


            const particles =
                Array.from(
                    {
                        length: 25
                    },
                    () => ({

                        x:
                            Math.random() *
                            sparkleCanvas.width,

                        y:
                            Math.random() *
                            sparkleCanvas.height,

                        size:
                            Math.random() * 2.5 +
                            1,

                        speedY:
                            -(
                                Math.random() *
                                0.15 +
                                0.05
                            ),

                        opacity:
                            Math.random() *
                            0.6 +
                            0.3

                    })
                );


            (function sparkleLoop() {

                ctx.clearRect(
                    0,
                    0,
                    sparkleCanvas.width,
                    sparkleCanvas.height
                );


                particles.forEach(
                    p => {

                        p.y +=
                            p.speedY;


                        if (
                            p.y < -20
                        ) {

                            p.y =
                                sparkleCanvas.height +
                                20;

                        }


                        ctx.save();


                        ctx.translate(
                            p.x,
                            p.y
                        );


                        ctx.fillStyle =
                            `rgba(
                                255,
                                255,
                                255,
                                ${p.opacity}
                            )`;


                        ctx.beginPath();


                        ctx.arc(
                            0,
                            0,
                            p.size,
                            0,
                            Math.PI * 2
                        );


                        ctx.fill();


                        ctx.restore();

                    }
                );


                requestAnimationFrame(
                    sparkleLoop
                );

            })();

        }


        /* =====================================================
           INIT EFFECTS
        ===================================================== */

        initThreeSmoke();

        initSparkles();


        /* =====================================================
           RESIZE
        ===================================================== */

        window.addEventListener(
            "resize",
            () => {

                if (renderer) {

                    renderer.setSize(
                        window.innerWidth,
                        window.innerHeight
                    );

                }


                sparkleCanvas.width =
                    particleCanvas.width =
                        window.innerWidth;


                sparkleCanvas.height =
                    particleCanvas.height =
                        window.innerHeight;

            }
        );


        /* =====================================================
           WELCOME → QUESTIONS
           
           IMPORTANT:
           NO video.play()
           NO video.ended dependency
        ===================================================== */

      function continueFromWelcome() {

    if (welcomeTransitioned)
        return;

    welcomeTransitioned = true;

    try {
        introVideo.pause();
    } catch (e) {}

    quizBox.classList.add("quiz-pull-out");

    setTimeout(() => {

        welcomeScreen.classList.add("hidden");

        questionScreen.classList.remove("hidden");

        overlayLayer.classList.remove("welcome-overlay");

        /*
         * إخفاء الـ Three.js smoke
         * حتى تظهر صور الأسئلة بإضاءتها الطبيعية
         */
        threeContainer.style.opacity = "0";

        /*
         * لا نستخدم dark filter
         */
        threeContainer.classList.remove("dimmed-smoke");

        /*
         * إلغاء أي overlay
         */
        overlayLayer.style.background = "transparent";

        bgLayer.style.opacity = "1";

        quizBox.classList.remove("quiz-pull-out");

        quizBox.classList.add("quiz-pull-in-prepare");

        try {

            welcomeSound.currentTime = 0;

            welcomeSound
                .play()
                .catch(() => {});

        } catch (e) {}

        setTimeout(() => {

            quizBox.style.transition = "";

            loadQuestion();

        }, 50);

    }, 300);
}


        /* =====================================================
           START BUTTON
           
           THIS IS THE IMPORTANT FIX
        ===================================================== */

        startQuizBtn.addEventListener(
    "click",
    () => {

        if (quizStarted)
            return;

        quizStarted = true;

        unlockMobileAudio();

        /*
         * نبدأ الفيديو مباشرة من ضغطة المستخدم.
         * هذا مهم للموبايل لأن الضغط يعتبر user interaction.
         */

        try {

            introVideo.currentTime = 0;

            const playPromise =
                introVideo.play();

            if (
                playPromise &&
                typeof playPromise.catch === "function"
            ) {

                playPromise.catch(() => {

                    /*
                     * إذا المتصفح رفض تشغيل الفيديو،
                     * لا نخلي التجربة تعلق.
                     */

                    setTimeout(() => {

                        if (!welcomeTransitioned) {
                            continueFromWelcome();
                        }

                    }, 1500);

                });

            }

        } catch (error) {

            setTimeout(() => {

                if (!welcomeTransitioned) {
                    continueFromWelcome();
                }

            }, 1500);

        }

    }
);
        introVideo.addEventListener(
    "ended",
    () => {

        if (!welcomeTransitioned) {
            continueFromWelcome();
        }

    }
);
        introVideo.addEventListener(
    "error",
    () => {

        if (!welcomeTransitioned) {
            continueFromWelcome();
        }

    }
);


        /* =====================================================
           LOAD QUESTION
        ===================================================== */

        function loadQuestion() {

            const currentData =
                quizData[
                    currentQuestionIndex
                ];


            if (!currentData)
                return;


            quizBox.classList.remove(
                "quiz-pull-out",
                "quiz-pull-in-prepare"
            );


            bgLayer.style.backgroundImage =
                `url("${currentData.image}")`;


            questionText.innerText =
                currentData.question;


            optionsContainer.innerHTML =
                "";


            currentData.options.forEach(
                (option, index) => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.classList.add(
                        "option-btn"
                    );


                    button.innerText =
                        option;


                    button.addEventListener(
                        "click",
                        event => {

                            handleAnswer(
                                event,
                                index
                            );

                        }
                    );


                    optionsContainer.appendChild(
                        button
                    );

                }
            );


            isAnswering =
                false;

        }


        /* =====================================================
           ANSWER
        ===================================================== */

        function handleAnswer(
            event,
            selectedIndex
        ) {

            if (
                isAnswering ||
                quizFinished
            ) {
                return;
            }


            isAnswering =
                true;


            const selectedButton =
                event.currentTarget;


            const currentData =
                quizData[
                    currentQuestionIndex
                ];


            const rect =
                selectedButton
                    .getBoundingClientRect();


            /*
             * Particle burst
             */

            particleSystem.burstParticles(
                rect.left +
                    rect.width / 2,

                rect.top +
                    rect.height / 2,

                35
            );


            /*
             * Score
             */

            totalScore +=
                currentData.scores[
                    selectedIndex
                ];


            /*
             * Store answer
             */

            userResponsesPayload[
                currentData.id
            ] =
                currentData.options[
                    selectedIndex
                ];


            /*
             * Click sound
             */

            try {

                clickSound.currentTime =
                    0;

                clickSound
                    .play()
                    .catch(() => {});

            } catch (e) {}


            selectedButton.classList.add(
                "btn-selected"
            );


            /*
             * Transition
             */

            setTimeout(
                () => {

                    quizBox.classList.add(
                        "quiz-pull-out"
                    );


                    setTimeout(
                        () => {

                            currentQuestionIndex++;


                            if (
                                currentQuestionIndex <
                                quizData.length
                            ) {

                                quizBox.style.transition =
                                    "none";


                                quizBox.classList.remove(
                                    "quiz-pull-out"
                                );


                                quizBox.classList.add(
                                    "quiz-pull-in-prepare"
                                );


                                setTimeout(
                                    () => {

                                        quizBox.style.transition =
                                            "";

                                        loadQuestion();

                                    },
                                    50
                                );

                            } else {

                                shipDataAndShowResults();

                            }

                        },
                        400
                    );

                },
                400
            );

        }


        /* =====================================================
           SCORE
        ===================================================== */

        function calculateScore() {

            return Number(
                (
                    totalScore /
                    quizData.length
                ).toFixed(1)
            );

        }


        /* =====================================================
           RESULT TYPE
        ===================================================== */

        function getResultByScore(
            score
        ) {

            if (
                score >= 91.1
            ) {

                return "Pink Glow";

            }


            if (
                score >= 70
            ) {

                return "Pink Balance";

            }


            return "Pink Revival";

        }


        /* =====================================================
           CODE
        ===================================================== */

        function generatePinkWhisperCode() {

            const now =
                new Date();


            const d =
                String(
                    now.getDate()
                ).padStart(
                    2,
                    "0"
                );


            const m =
                String(
                    now.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );


            const y =
                String(
                    now.getFullYear()
                ).slice(-2);


            const rand =
                Math.floor(
                    1000 +
                    Math.random() *
                    9000
                );


            return `PW-${d}${m}${y}-${rand}`;

        }


        /* =====================================================
           GOOGLE SHEETS
        ===================================================== */

        async function sendToGoogleSheets(
            payload
        ) {

            try {

                await fetch(
                    GOOGLE_SCRIPT_URL,
                    {

                        method:
                            "POST",

                        mode:
                            "no-cors",

                        headers: {

                            "Content-Type":
                                "text/plain;charset=UTF-8"

                        },

                        body:
                            JSON.stringify(
                                payload
                            )

                    }
                );

            } catch (error) {

                console.error(
                    "Google Sheets error:",
                    error
                );

            }

        }


        /* =====================================================
           SEND DATA + RESULTS
        ===================================================== */

        function shipDataAndShowResults() {

            if (quizFinished)
                return;


            quizFinished =
                true;


            const score =
                calculateScore();


            const resultWord =
                getResultByScore(
                    score
                );


            finalGeneratedCode =
                generatePinkWhisperCode();


            /*
             * Send to Google Sheets
             */

            sendToGoogleSheets({

                code:
                    finalGeneratedCode,

                result:
                    resultWord,

                score:
                    `${score}%`,

                q1:
                    userResponsesPayload["q1"] ||
                    "",

                q2:
                    userResponsesPayload["q2"] ||
                    "",

                q3:
                    userResponsesPayload["q3"] ||
                    "",

                q4:
                    userResponsesPayload["q4"] ||
                    "",

                q5:
                    userResponsesPayload["q5"] ||
                    "",

                q6:
                    userResponsesPayload["q6"] ||
                    ""

            });


            /*
             * Show result immediately.
             */

            showResults(
                resultWord,
                score,
                finalGeneratedCode
            );

        }


        /* =====================================================
           SHOW RESULTS
        ===================================================== */

        function showResults(
            resultWord,
            score,
            code
        ) {

            questionScreen.classList.add(
                "hidden"
            );


            resultScreen.classList.remove(
                "hidden"
            );


            quizBox.classList.remove(
                "quiz-pull-out",
                "quiz-pull-in-prepare"
            );


            /*
             * Result background
             */

            if (
                resultWord ===
                "Pink Glow"
            ) {

                document.body.style.backgroundImage =
                    "url('bg1.png')";


                if (
                    typeof confetti ===
                    "function"
                ) {

                    confetti({

                        particleCount:
                            100,

                        spread:
                            70,

                        origin: {
                            y: 0.6
                        }

                    });

                }

            } else if (
                resultWord ===
                "Pink Balance"
            ) {

                document.body.style.backgroundImage =
                    "url('bg2.png')";

            } else {

                document.body.style.backgroundImage =
                    "url('bg3.png')";

            }


            /*
             * Result content
             */

            badgeContainer.innerText =
                resultWord;


            scoreContainer.innerText =
                `${score}%`;


            descriptionContainer.innerText =
                "تحب تعرف شنو يعني هاي النتيجة؟ اضغط على الزر بالاسفل 👇";


            codeTextPlaceholder.innerText =
                code;


            /*
             * WhatsApp
             */

            const msg =
                encodeURIComponent(
                    `${code}\nارسل الكود`
                );


            whatsappRedirectBtn.href =
                `https://wa.me/${
                    WHATSAPP_PHONE_NUMBER
                }?text=${msg}`;

        }


        /* =====================================================
           COPY CODE
        ===================================================== */

        premiumCodeBox.addEventListener(
            "click",
            async () => {

                if (
                    !finalGeneratedCode
                ) {
                    return;
                }


                try {

                    await navigator
                        .clipboard
                        .writeText(
                            finalGeneratedCode
                        );


                    alert(
                        "تم نسخ الكود بنجاح: " +
                        finalGeneratedCode
                    );

                } catch (error) {

                    alert(
                        "الكود الخاص بك هو: " +
                        finalGeneratedCode
                    );

                }

            }
        );

    </script>
